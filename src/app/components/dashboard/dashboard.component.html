<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex">
  <!-- Sidebar -->
  <aside [class.translate-x-0]="sidebarVisible"
         [class.-translate-x-full]="!sidebarVisible"
         class="fixed lg:sticky top-0 left-0 h-screen bg-white shadow-lg z-40 transition-transform duration-300 ease-in-out lg:translate-x-0 w-64">
    <div class="h-full flex flex-col">
      <!-- Logo -->
      <div class="p-6 border-b border-gray-200">
        <h2 class="text-2xl font-bold text-green-700">🌾 FarmPrecise</h2>
        <p class="text-xs text-gray-500 mt-1">農業資料平台</p>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 p-4 space-y-2">
        <button *ngFor="let item of menuItems; let i = index"
                (click)="activeIndex = i; sidebarVisible = false"
                [class.bg-green-600]="activeIndex === i"
                [class.text-white]="activeIndex === i"
                [class.shadow-md]="activeIndex === i"
                [class.text-gray-700]="activeIndex !== i"
                [class.hover:bg-gray-100]="activeIndex !== i"
                class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200">
          <i [class]="item.icon" class="text-xl"></i>
          <span class="font-medium">{{ item.label }}</span>
        </button>
      </nav>

      <!-- Footer -->
      <div class="p-4 border-t border-gray-200">
        <div class="text-xs text-gray-500 text-center">
          <p>資料來源</p>
          <p class="font-medium">農業部開放平台</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Mobile menu button -->
  <button (click)="toggleSidebar()"
          class="lg:hidden fixed top-20 left-4 z-50 bg-green-600 text-white p-3 rounded-lg shadow-lg">
    {{ sidebarVisible ? '✕' : '☰' }}
  </button>

  <!-- Overlay for mobile -->
  <div *ngIf="sidebarVisible"
       (click)="sidebarVisible = false"
       class="lg:hidden fixed inset-0 bg-black bg-opacity-50 z-30"></div>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-h-screen lg:ml-0">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
      <div class="px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex justify-between items-center">
          <div class="lg:hidden">
            <h1 class="text-2xl font-bold text-green-700">FarmPrecise</h1>
          </div>
          <div class="hidden lg:block">
            <h1 class="text-2xl font-bold text-gray-800">
              {{ menuItems[activeIndex].label }}
            </h1>
          </div>
          <a routerLink="/" class="text-sm text-green-600 hover:text-green-700 font-medium flex items-center gap-1">
            <span>←</span>
            <span class="hidden sm:inline">返回首頁</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 overflow-auto">
      <app-weather-section *ngIf="activeIndex === 0"></app-weather-section>
      <app-trading-section *ngIf="activeIndex === 1"></app-trading-section>
      <app-news-section *ngIf="activeIndex === 2"></app-news-section>
    </main>
  </div>
</div>
